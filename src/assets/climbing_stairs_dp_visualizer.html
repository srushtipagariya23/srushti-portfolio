<!DOCTYPE html> <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climbing Stairs DP Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0b57d0;
            --surface: #fff;
            --surface-container: #f0f4f9;
            --surface-container-high: #e9ebf0;
            --on-surface: #1b1c1d;
            --on-surface-variant: #444746;
            --stroke: #dcdfe5;
            --success: #146c2e;
            --warning: #b3261e;
            --ff-sans: "Google Sans", sans-serif;
        }
        body, html { height: 100%; margin: 0; padding: 0; font-family: var(--ff-sans); background: var(--surface); color: var(--on-surface); overflow: hidden; }
        .app-layout { height: 100%; display: flex; flex-direction: column; }
        .widget-header { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--stroke); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .widget-title { margin: 0; font-size: 18px; font-weight: 500; }
        
        .hud-panel { display: flex; gap: 24px; padding: 12px 16px; background: var(--surface-container); border-bottom: 1px solid var(--stroke); flex-shrink: 0; }
        .hud-item { display: flex; flex-direction: column; flex-grow: 1; }
        .hud-label { font-size: 11px; color: var(--on-surface-variant); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .hud-value { font-size: 15px; font-weight: 600; color: var(--primary); margin-top: 2px; }

        .viz-container { flex-grow: 1; position: relative; overflow: hidden; background: var(--surface); display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
        
        .controls-root { padding: 16px; background: var(--surface-container-high); border-top: 1px solid var(--stroke); flex-shrink: 0; display: flex; justify-content: center; gap: 12px; }
        .btn { height: 36px; padding: 0 20px; border-radius: 18px; border: none; font-family: var(--ff-sans); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { filter: brightness(0.9); }
        .btn-secondary { background: var(--surface); color: var(--on-surface); border: 1px solid var(--stroke); }
        .btn-secondary:hover { background: var(--surface-container); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="widget-header">
            <h3 class="widget-title">Climbing Stairs (Tabulation)</h3>
        </div>
        
        <div class="hud-panel" id="hud">
            <div class="hud-item"><span class="hud-label">Current Goal</span><span class="hud-value" id="hud-goal">Calculate ways to step 2</span></div>
            <div class="hud-item"><span class="hud-label">Formula</span><span class="hud-value" id="hud-formula">dp[2] = dp[1] + dp[0]</span></div>
        </div>
        
        <div class="viz-container" id="viz">
            <canvas id="sim-canvas"></canvas>
        </div>
        
        <div class="controls-root">
            <button class="btn btn-secondary" id="btn-reset"><span class="material-icons" style="font-size: 18px;">restart_alt</span> Reset</button>
            <button class="btn btn-primary" id="btn-step">Calculate Next <span class="material-icons" style="font-size: 18px;">arrow_forward</span></button>
        </div>
    </div>

    <script>
        const N = 6;
        let step = 2; 
        let dp = Array(N + 1).fill(0);
        dp[0] = 1;
        dp[1] = 1;
        let isFinished = false;

        const updateHUD = () => {
            const goalEl = document.getElementById('hud-goal');
            const formulaEl = document.getElementById('hud-formula');
            
            if (isFinished) {
                goalEl.innerText = `Finished!`;
                goalEl.style.color = 'var(--success)';
                formulaEl.innerText = `Total ways to reach step ${N} is ${dp[N]}`;
            } else {
                goalEl.innerText = `Calculate ways to reach step ${step}`;
                goalEl.style.color = 'var(--primary)';
                formulaEl.innerText = `dp[${step}] = dp[${step-1}] + dp[${step-2}] = ${dp[step-1]} + ${dp[step-2]}`;
            }
            
            document.getElementById('btn-step').disabled = isFinished;
        };

        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');

        const resize = () => {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * devicePixelRatio;
            canvas.height = rect.height * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);
            draw();
        };

        window.addEventListener('resize', resize);

        const drawArrow = (fromX, fromY, toX, toY) => {
            const headlen = 8;
            const dx = toX - fromX;
            const dy = toY - fromY;
            const angle = Math.atan2(dy, dx);
            
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        };

        const draw = () => {
            const w = canvas.width / devicePixelRatio;
            const h = canvas.height / devicePixelRatio;
            ctx.clearRect(0, 0, w, h);

            const boxW = Math.min(60, (w - 40) / (N + 1));
            const startX = (w - ((N + 1) * boxW)) / 2;
            const cy = h / 2;

            ctx.fillStyle = '#444746';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("DP Array Memory", w/2, cy - boxW - 30);

            for (let i = 0; i <= N; i++) {
                const x = startX + i * boxW;
                const y = cy - boxW/2;
                
                // Determine block colors
                let bg = '#f0f4f9';
                let border = '#80858c';
                let textColor = '#1b1c1d';

                if (i === step && !isFinished) {
                    bg = '#d3e3fd'; // Active calculating
                    border = '#0b57d0';
                } else if (i === step - 1 || i === step - 2) {
                    bg = '#c4eed0'; // Dependencies (previous 2)
                    border = '#146c2e';
                } else if (i < step) {
                    bg = '#e9ebf0'; // Done
                    textColor = '#444746';
                }

                if (isFinished && i === N) {
                    bg = '#146c2e';
                    border = '#146c2e';
                    textColor = '#fff';
                }

                // Draw Box
                ctx.fillStyle = bg;
                ctx.strokeStyle = border;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(x + 2, y, boxW - 4, boxW, 4);
                ctx.fill();
                ctx.stroke();

                // Draw Value
                ctx.fillStyle = textColor;
                ctx.font = `bold ${boxW * 0.4}px monospace`;
                ctx.textBaseline = 'middle';
                const displayVal = (i < step || (isFinished)) ? dp[i] : "?";
                ctx.fillText(displayVal, x + boxW/2, cy);

                // Draw Index (Step Number)
                ctx.fillStyle = '#444746';
                ctx.font = '11px sans-serif';
                ctx.fillText(`Step ${i}`, x + boxW/2, y + boxW + 15);
            }

            // Draw Arrows indicating the relationship
            if (!isFinished) {
                ctx.strokeStyle = '#0b57d0';
                ctx.lineWidth = 2;
                
                // Arrow from step-1
                const x1 = startX + (step - 1) * boxW + boxW/2;
                const x2 = startX + (step - 2) * boxW + boxW/2;
                const destX = startX + step * boxW + boxW/2;
                const topY = cy - boxW/2;

                // Curve from i-1
                ctx.beginPath();
                ctx.moveTo(x1, topY);
                ctx.quadraticCurveTo((x1 + destX)/2, topY - 30, destX, topY - 5);
                ctx.stroke();
                drawArrow((x1 + destX)/2, topY - 30, destX, topY - 5);

                // Curve from i-2
                ctx.beginPath();
                ctx.moveTo(x2, topY);
                ctx.quadraticCurveTo((x2 + destX)/2, topY - 60, destX, topY - 5);
                ctx.stroke();
                drawArrow((x2 + destX)/2, topY - 60, destX, topY - 5);
            }
        };

        document.getElementById('btn-step').onclick = () => {
            if (isFinished) return;
            
            // Calculate
            dp[step] = dp[step - 1] + dp[step - 2];
            
            step++;
            if (step > N) {
                isFinished = true;
            }
            
            updateHUD();
            draw();
        };

        document.getElementById('btn-reset').onclick = () => {
            step = 2;
            dp = Array(N + 1).fill(0);
            dp[0] = 1;
            dp[1] = 1;
            isFinished = false;
            updateHUD();
            draw();
        };

        // Init
        updateHUD();
        setTimeout(resize, 100);
    </script>
</body>
</html>
